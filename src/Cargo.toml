[package]
name = "taris"
version = "0.1.0"
description = "A blazing-fast GPU-accelerated Homelab & SSH Studio"
authors = ["Leni"]
edition = "2021"

[lib]
name = "taris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = "0.4"
portable-pty = "0.8"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
ssh2 = "0.9"
netstat2 = "0.11"
tokio = { version = "1", features = ["net", "sync", "rt", "io-util", "macros"] }

rfd = "0.15"
boringtun = "0.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
