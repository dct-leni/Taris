name: Build & Release Taris

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x86_64)
            os: windows-latest
            artifact_name: taris-windows-x86_64.zip
            script: cmd /c build.bat
            archive_cmd: Compress-Archive -Path output/* -DestinationPath taris-windows-x86_64.zip

          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact_name: taris-linux-x86_64.tar.gz
            script: chmod +x build.sh && ./build.sh
            archive_cmd: tar -czvf taris-linux-x86_64.tar.gz -C output .

          - name: macOS (Universal)
            os: macos-latest
            artifact_name: taris-macos-universal.tar.gz
            script: chmod +x build.sh && ./build.sh
            archive_cmd: tar -czvf taris-macos-universal.tar.gz -C output .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src

      - name: Run Build & Package Script
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmd.exe /c build.bat
          else
            chmod +x build.sh
            ./build.sh
          fi

      - name: Create Release Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path output\* -DestinationPath ${{ matrix.platform.artifact_name }} -Force"
          else
            tar -czvf "${{ matrix.platform.artifact_name }}" -C output .
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
